# Demo site (GitHub Pages): builds the in-browser demo from web/ and
# deploys web/site. Enable it with Settings > Pages > Source: GitHub Actions.
# The example gallery is generated by the engine here, never committed, and
# the WebAssembly module must reproduce it before anything is deployed.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web
      # must match the `wasm-bindgen` version pinned in web/Cargo.toml
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - name: demo crate tests
        working-directory: web
        run: cargo --locked test
      - name: build the WebAssembly module
        working-directory: web
        run: cargo --locked build --release --lib --target wasm32-unknown-unknown
      - name: bindgen (web for the page, nodejs for the check)
        working-directory: web
        run: |
          wasm-bindgen --target web --out-dir site/pkg target/wasm32-unknown-unknown/release/redactify_web.wasm
          wasm-bindgen --target nodejs --out-dir target/node-pkg target/wasm32-unknown-unknown/release/redactify_web.wasm
      - name: example gallery from the engine
        working-directory: web
        run: cargo --locked run --release --bin gen-gallery -- fixtures/gallery.jsonl site/gallery.json
      - name: the WebAssembly module reproduces the gallery
        working-directory: web
        run: node check-gallery.cjs target/node-pkg site/gallery.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
